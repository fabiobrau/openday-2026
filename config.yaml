# OPEN DAY 2026 -- semantic segmentation demo configuration.
# The operator should only ever need to touch `camera`, `ui.lang` and `effect`.

device: mps              # mps | cpu | cuda -- shared by both networks

segmentation:
  # The network the audience watches: one class per pixel, live.
  name: yolov8n-seg
  weights: assets/models/yolov8n-seg.pt
  imgsz: 640             # masks come back at 360x640 for a 16:9 camera
  conf: 0.4
  # Only the classes a group of teenagers round a monitor actually brings:
  # 0 person, 24 backpack, 26 handbag, 39 bottle, 56 chair, 63 laptop,
  # 67 cell phone. Fewer classes = a legend the room can read at a glance.
  # Any COCO id works; add its colour under ui.class_colors.
  classes: [0, 24, 26, 39, 56, 63, 67]
  min_area_frac: 0.002   # drop masks smaller than this share of the frame

trigger:
  # A second, small detector that only reads the neuron poster A drives.
  # Poster A was optimised against THIS network; it does nothing to the
  # segmenter (measured, docs/OPENDAY_NOTES.md), so both have to run.
  name: yolov8n
  weights: assets/models/yolov8n.pt
  imgsz: 1280            # drives how small the poster can be: fires from
                         # ~100-160 px at 1280, needs ~240 px at 640.
  target_class: 78       # 'hair drier' -- never in frame at an open day
  threshold: 0.20        # the decoy sits at 0.000 exactly
  latch_seconds: 0.5     # the class fires on ~half the frames; hold it
  every_n_frames: 2      # run the trigger every 2nd frame: ~+5 fps, and the
                         # latch hides the gap. Set 1 if the Mac has headroom.
  fade_seconds: 0.35     # ease the effect in and out

patch:
  # `target_model` is a hard guard: the app refuses to start if it disagrees
  # with trigger.name above, because a patch only moves the model it was
  # optimised against. The images are only read by tools/.
  target_model: yolov8n
  images:
    adversarial: assets/patches/magic_dog.png
    dog: assets/decoys/dog_photo.jpg

effect:
  mode: vanish           # vanish | relabel -- press E to switch live
  relabel_to: 78         # relabel paints the holder as this class. 78 is the
                         # honest choice: it is the class the poster really
                         # lights up, just on a different network.
  target: holder         # holder: only whoever holds the poster | all -- T
  plate_rate: 0.04       # how fast the background plate adapts (per frame)
  plate_dilate_px: 15    # keep this far from any person when learning it

camera:
  index: 0               # override with --camera; never guessed automatically
  width: 1280
  height: 720
  fps: 30
  mirror: true           # display only -- both networks see the raw frame,
                         # or the printed poster reaches the trigger flipped

ui:
  lang: it
  fullscreen: true
  font: assets/fonts/SpaceGrotesk.ttf
  show_fps: false
  view: overlay          # overlay | mask | matrix -- press M to cycle
  mask_alpha: 0.5        # overlay view: how strongly classes tint the camera
  matrix_ghost: 0.0      # matrix view: blend a faint camera copy behind the code
  chart_seconds: 10
  # BGR, because OpenCV.
  colors:
    panel_bg: [34, 26, 22]
    bar_bg: [26, 20, 17]
    text: [245, 245, 245]
    dim: [150, 150, 150]
    accent: [255, 196, 46]       # model panel title
    good: [120, 220, 90]
    warn: [60, 170, 255]
    effect: [220, 0, 255]        # shaded "effect on" band in the chart
    person_trace: [255, 196, 46]
    neuron: [220, 0, 255]
  class_colors:
    0: [255, 196, 46]     # person      light blue
    24: [28, 159, 255]    # backpack    orange
    26: [146, 99, 255]    # handbag     pink
    39: [90, 230, 130]    # bottle      green
    56: [255, 120, 170]   # chair       violet
    63: [200, 220, 60]    # laptop      teal
    67: [70, 70, 255]     # cell phone  red
    78: [220, 0, 255]     # hair drier  magenta (relabel target)

branding:
  # Each logo sits in its own corner, with no plate behind it -- so supply
  # artwork that reads on a dark background. A missing file is skipped.
  text: "Open Day 2026"
  logos:
    - path: assets/logos/saiferlab.png
      pos: top-left
      height: 58
    - path: assets/logos/unica_white.png
      pos: bottom-right
      height: 44

fallback:
  # Used with --fallback, or automatically if the camera dies. The frames go
  # through the live pipeline, so the effect is real, not a recording of it.
  video: assets/fallback/loop.mp4
  stills_dir: assets/fallback/stills
